services:
  context_graph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: context_graph
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8899}:${PORT:-8899}"
    volumes:
      # Persistencia estática base de grafos y configuración
      - ./data/projects:/data/projects
      - ./projects_config.json:/app/projects_config.json:ro
      - ./web:/app/web
      - ./server/app:/app/server/app
    environment:
      - DATA_PATH=/data/projects
      - PORT=${PORT:-8899}
      - HOST=0.0.0.0
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OMP_WAIT_POLICY=PASSIVE
